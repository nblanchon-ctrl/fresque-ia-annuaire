<script>
const DOCS={"00_Sommaire.html": "<h1>Kit de communication et de prospection</h1><p><strong>Tour de France de la Fresque de l’IA · janvier–février 2027</strong><br>Version de travail du 29 septembre 2026. Prospection à partir du 15 octobre.</p><p>Ouvrez les fichiers dans l’ordre ou accédez directement au document dont vous avez besoin. Les textes entre crochets sont à personnaliser.</p><ol><li><a href=\"#\" onclick=\"showDoc('01_Cadrage_et_positionnement.html'); return false;\" >Cadrage et positionnement</a></li><li><a href=\"#\" onclick=\"showDoc('02_Publics_et_objectifs.html'); return false;\" >Publics et objectifs</a></li><li><a href=\"#\" onclick=\"showDoc('03_Proposition_aux_partenaires.html'); return false;\" >Proposition aux partenaires</a></li><li><a href=\"#\" onclick=\"showDoc('04_Argumentaire_et_objections.html'); return false;\" >Argumentaire et objections</a></li><li><a href=\"#\" onclick=\"showDoc('05_Prospection_partenaires.html'); return false;\" >Prospection partenaires</a></li><li><a href=\"#\" onclick=\"showDoc('06_Invitations_participants.html'); return false;\" >Invitations participants</a></li><li><a href=\"#\" onclick=\"showDoc('07_Plan_action_et_suivi.html'); return false;\" >Plan action et suivi</a></li><li><a href=\"#\" onclick=\"showDoc('08_Conseils_terrain.html'); return false;\" >Conseils terrain</a></li><li><a href=\"#\" onclick=\"showDoc('09_Mode_emploi_et_elements_nationaux.html'); return false;\" >Mode emploi et elements nationaux</a></li></ol><p><strong>Avant diffusion :</strong> confirmer les dates locales, les liens d’inscription, les logos autorisés et les modalités de suivi des contacts.</p>", "01_Cadrage_et_positionnement.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>1. Le projet en une minute</h2><p>Le Tour de France de la Fresque de l’IA va à la rencontre des acteurs économiques et professionnels des territoires. Avec les animateurs locaux, nous proposons des <strong>rencontres gratuites de 45 minutes</strong> pour ouvrir un débat concret sur les usages de l’IA, ses impacts et les conditions de sa mise en œuvre. La Fresque de l’IA apporte le cadre et les exemples qui nourrissent l’échange. Chaque rencontre peut ensuite donner envie aux organisations d’aller plus loin avec un atelier complet.</p><p><strong>Notre demande aux relais locaux :</strong> accueillir ou coorganiser une rencontre, la faire connaître auprès de leurs adhérents et inviter les entreprises du territoire. <strong>Notre apport :</strong> le contenu, l’animation et les supports de communication. Le partenariat est proposé à titre gracieux : il sert une mission d’acculturation largement accessible et donne aussi de la visibilité à la Fresque et à ses animateurs. Aucun achat ultérieur n’est attendu des participants ou du partenaire.</p><blockquote><strong>Phrase repère :</strong> « Et si nous ouvrions, dans votre territoire, un échange utile sur l’IA avec les entreprises et organisations qui la vivent déjà au quotidien ? »</blockquote>", "02_Publics_et_objectifs.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>2. Deux parcours à traiter séparément</h2><table><thead><tr><th>Public</th><th>Objectif</th><th>Appel à l’action</th></tr></thead><tbody><tr><td><strong>Partenaires relais</strong> : CCI, fédérations professionnelles, branches et antennes locales, MEDEF/CPME, réseaux d’entreprises, pôles et clusters, collectivités ou structures d’accompagnement</td><td>Obtenir un contact référent, un créneau, un lieu ou format en ligne, et une diffusion à leur réseau</td><td>« Échangeons 20 minutes pour envisager une rencontre dans votre territoire. »</td></tr><tr><td><strong>Participants</strong> : dirigeants, managers, salariés, indépendants et autres acteurs locaux</td><td>Obtenir des inscriptions qualifiées et une présence effective</td><td>« Inscrivez-vous à la rencontre près de chez vous. »</td></tr></tbody></table><p>Employer <strong>partenaire relais</strong> ou <strong>organisation hôte</strong>, plutôt que « sponsor » dans les sollicitations : le concours attendu porte d’abord sur la mobilisation, le lieu et la communication, sans présumer d’une contribution financière.</p>", "03_Proposition_aux_partenaires.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>3. Proposition concrète au partenaire</h2><ul><li><strong>Format :</strong> 45 minutes de débat animé autour de questions concrètes : où l’IA est-elle déjà utilisée, quelles opportunités, quels risques, et quelles conditions pour avancer ? Une courte présentation de la démarche Fresque conclut la séance.</li><li><strong>Public :</strong> adhérents, entreprises et organisations du territoire ; jauge et niveau de spécialisation à fixer avec l’hôte.</li><li><strong>Rôle de l’animateur :</strong> préparer le contenu, animer, fournir les textes et visuels de promotion, gérer les suites liées à la Fresque.</li><li><strong>Rôle possible de l’hôte :</strong> proposer une salle, identifier le public, relayer l’invitation par courriel et sur ses canaux, accueillir les inscrits. La répartition exacte est convenue ensemble.</li><li><strong>Bénéfice de l’hôte :</strong> offrir à ses membres un temps court, accessible et ancré dans leurs préoccupations, avec un expert local et un débat qui peut éclairer ses futures actions d’accompagnement.</li><li><strong>Suites :</strong> ressources et proposition d’atelier complet pour les seuls contacts intéressés, selon des modalités d’inscription et de suivi convenues avec l’hôte.</li></ul><p><strong>À verrouiller au niveau national avant diffusion :</strong> identité visuelle, formulaire et traitement des inscriptions, politique de données, calendrier et carte des étapes, capacité des animateurs, frais éventuels de salle, règles d’usage des logos et promesse exacte faite aux partenaires. Ne pas annoncer une couverture exhaustive du territoire ni une date locale non confirmée.</p>", "04_Argumentaire_et_objections.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>4. Messages communs et réponses aux objections</h2><h3>Les cinq messages à répéter</h3><ol><li><strong>Un débat territorial, ouvert et concret</strong> sur l’IA au travail et dans les organisations.</li><li><strong>45 minutes gratuites</strong> pour démarrer la discussion sans prérequis.</li><li><strong>Un animateur local</strong> qui comprend les réalités du territoire et peut faire vivre les échanges.</li><li><strong>La Fresque de l’IA comme support</strong>, pour relier cas d’usage, impacts, risques et conditions de réussite.</li><li><strong>Un partenariat simple</strong> : nous animons, le relais local nous aide à réunir les bonnes personnes.</li></ol><h3>Objections fréquentes</h3><table><thead><tr><th>Objection</th><th>Réponse possible</th></tr></thead><tbody><tr><td>« Nous organisons déjà des conférences IA. »</td><td>« Justement, ce format court peut compléter vos actions : il donne une large place au débat et aux préoccupations de vos adhérents. Nous pouvons l’adapter aux sujets qui reviennent chez vous. »</td></tr><tr><td>« Pourquoi est-ce gratuit ? »</td><td>« Nous voulons rendre ce premier échange accessible et rencontrer les acteurs du territoire. Cette visibilité peut ensuite susciter des demandes d’ateliers complets ; il n’y a aucune obligation d’achat. »</td></tr><tr><td>« Nous ne pouvons pas gérer un événement de plus. »</td><td>« Nous fournissons l’animation et les textes d’invitation. Voyons ensemble le minimum que vous pourriez relayer, ou un créneau déjà prévu dans votre programmation. »</td></tr><tr><td>« Nos adhérents ne sont pas experts. »</td><td>« Le format part de leurs situations concrètes et ne demande aucune connaissance préalable. »</td></tr><tr><td>« Est-ce une présentation commerciale ? »</td><td>« La rencontre est d’abord un débat d’acculturation. Nous présenterons brièvement la Fresque en fin de séance pour que ceux qui le souhaitent sachent comment prolonger la discussion. »</td></tr><tr><td>« Quelle visibilité pour notre organisation ? »</td><td>« Nous pouvons vous présenter comme partenaire de l’étape, sous réserve de votre accord sur les visuels et les messages. »</td></tr></tbody></table>", "05_Prospection_partenaires.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>5. Prospection des partenaires : séquences prêtes à adapter</h2><p><strong>Règle :</strong> personnaliser la première phrase avec un enjeu du réseau, une actualité connue de l’organisation ou un interlocuteur commun ; ne jamais feindre une relation. Remplacer tous les champs entre crochets et vérifier les dates avant envoi.</p><h3>LinkedIn — invitation (courte)</h3><p>Bonjour [Prénom], nous préparons une étape du Tour de France de la Fresque de l’IA dans [territoire] début 2027 : des échanges gratuits de 45 minutes sur l’IA avec les acteurs locaux. Votre réseau pourrait y trouver un intérêt. Ravi d’échanger avec vous, Nicolas / [Prénom animateur].</p><h3>LinkedIn — après acceptation</h3><p>Bonjour [Prénom], merci pour votre acceptation. Dans le cadre du Tour de France de la Fresque de l’IA, nous souhaitons organiser à [territoire] une rencontre gratuite de 45 minutes pour faire débattre les entreprises locales des usages, impacts et conditions de réussite de l’IA. Nous apportons l’animation et les supports ; nous cherchons des organisations capables de réunir leurs adhérents et, si possible, de nous accueillir. Seriez-vous disponible pour un échange de 20 minutes afin de voir si une étape commune aurait du sens pour [organisation] ?</p><h3>LinkedIn — première relance (5 à 7 jours ouvrés plus tard)</h3><p>Bonjour [Prénom], je me permets de revenir vers vous au sujet d’une rencontre IA de 45 minutes à [territoire], que nous pourrions proposer gratuitement à vos adhérents en janvier ou février. L’objectif est de partir de leurs questions et d’ouvrir un débat utile, avec un animateur local. Est-ce un sujet pertinent pour [organisation] ?</p><h3>LinkedIn — dernière relance (7 à 10 jours ouvrés plus tard)</h3><p>Bonjour [Prénom], je clôture mon message pour ne pas vous solliciter davantage. Si l’idée d’un débat IA court pour les membres de [organisation] vous intéresse, je peux vous envoyer une proposition d’étape en quelques lignes. Sinon, sauriez-vous quelle personne pilote les événements ou l’accompagnement des adhérents sur ce sujet ? Merci !</p><h3>Courriel initial</h3><p><strong>Objet :</strong> Une rencontre IA pour les entreprises de [territoire] avec [organisation] ?</p><p>Bonjour [Prénom],</p><p>Dans le cadre du Tour de France de la Fresque de l’IA, notre réseau d’animateurs souhaite aller à la rencontre des entreprises et organisations de [territoire] en janvier et février 2027.</p><p>Nous proposons à leurs équipes et dirigeants une <strong>rencontre gratuite de 45 minutes</strong> pour débattre des usages de l’IA, de ses impacts et des conditions qui permettent de l’utiliser avec discernement. La Fresque de l’IA servira de support à la discussion.</p><p>Nous cherchons des partenaires locaux pour accueillir une étape et la faire connaître à leurs adhérents. De notre côté, nous préparons le contenu, animons l’échange et fournissons les éléments d’invitation. Ce premier format est proposé à titre gracieux : il contribue à l’acculturation du territoire et nous permet de faire connaître notre démarche, sans engagement commercial pour vos adhérents.</p><p>Seriez-vous disponible pour en discuter 20 minutes [proposer deux créneaux précis] ? Nous pourrions définir ensemble le public, le lieu et un angle adapté aux questions de vos membres.</p><p>Bien cordialement,</p><p>[Nom, qualité d’animateur, téléphone, site : lafresquedelia.com]</p><h3>Courriel de relance 1 (5 à 7 jours ouvrés)</h3><p><strong>Objet :</strong> Re: Une rencontre IA pour les entreprises de [territoire] ?</p><p>Bonjour [Prénom],</p><p>Je reviens vers vous concernant une étape du Tour de France de la Fresque de l’IA à [territoire]. Le principe est simple : nous animons gratuitement un débat de 45 minutes sur l’IA ; [organisation] nous aide à le proposer à ses adhérents et, si possible, à l’accueillir.</p><p>Pensez-vous que ce format répondrait aux questions que vous recevez de vos membres ? Je peux vous adresser une proposition courte ou en parler avec vous [créneaux].</p><p>Bien cordialement,</p><p>[Signature]</p><h3>Courriel de relance 2 (7 à 10 jours ouvrés)</h3><p><strong>Objet :</strong> Dernier retour — étape IA à [territoire]</p><p>Bonjour [Prénom],</p><p>Je me permets un dernier message au sujet d’une rencontre gratuite de 45 minutes autour de l’IA pour les acteurs de [territoire], envisagée début 2027. Si le sujet n’entre pas dans vos priorités, aucun souci. Si une autre personne coordonne les événements ou l’accompagnement des adhérents, pourriez-vous m’indiquer à qui présenter cette proposition ?</p><p>Merci pour votre retour,</p><p>[Signature]</p><h3>Appel téléphonique — accueil / standard (30 secondes)</h3><p>« Bonjour, je suis [nom], animateur de la Fresque de l’IA à [territoire]. Nous préparons pour début 2027 une rencontre gratuite de 45 minutes sur l’IA destinée aux entreprises locales. Je cherche la personne qui organise les événements ou les actions pour vos adhérents. Pourriez-vous me l’indiquer ? »</p><h3>Appel téléphonique — décideur (2 minutes)</h3><p>« Bonjour [Prénom], je vous appelle au sujet du Tour de France de la Fresque de l’IA. Dans [territoire], nous aimerions réunir vos adhérents pour un débat gratuit de 45 minutes sur leurs usages de l’IA et les questions que cela soulève. Nous apportons l’animation et la préparation ; nous cherchons un partenaire qui puisse les inviter et éventuellement nous accueillir. Quels sujets IA vos membres vous remontent-ils aujourd’hui ? [Écouter, reformuler.] Pensez-vous qu’un tel échange aurait sa place dans votre programmation de janvier ou février ? Si oui, fixons 20 minutes pour cadrer public, date et diffusion. »</p><p><strong>Si répondeur :</strong> « Bonjour [Prénom], [nom], animateur de la Fresque de l’IA à [territoire]. Je vous contacte pour envisager une rencontre gratuite de 45 minutes sur l’IA pour votre réseau début 2027. Je vous adresse un courriel avec le principe et mes coordonnées. Vous pouvez me rappeler au [numéro]. »</p><h3>Mini ordre du jour du rendez-vous partenaire (20 minutes)</h3><ol><li>Questions et priorités IA de ses adhérents (5 min).</li><li>Proposition de format, public, taille et angle local (5 min).</li><li>Date, lieu, inscription, relais de communication, rôles (7 min).</li><li>Décision et prochaine action datée de chacun (3 min).</li></ol><p><strong>Après accord :</strong> envoyer une fiche récapitulative d’une page avec date, adresse, capacité, titre, angle, noms et logos autorisés, lien d’inscription, responsable de chaque diffusion et échéances. Un accord oral sans prochaine action ni date ne constitue pas une étape confirmée.</p>", "06_Invitations_participants.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>6. Mobiliser les participants</h2><h3>Page d’inscription ou annonce partenaire</h3><p><strong>Titre :</strong> L’IA dans nos organisations : échangeons à [ville]</p><p><strong>Sous-titre :</strong> Une rencontre gratuite de 45 minutes dans le cadre du Tour de France de la Fresque de l’IA.</p><p>L’IA prend déjà place dans de nombreux métiers. Quels usages apportent une aide réelle ? Quelles questions de fiabilité, de compétences, de confidentialité ou d’impact faut-il se poser ? Venez partager vos expériences et vos interrogations avec d’autres acteurs de [territoire]. Un animateur local utilisera la Fresque de l’IA comme support pour lancer le débat et présenter les pistes pour poursuivre la réflexion.</p><p><strong>[Date, heure, lieu, public concerné, nombre de places, accessibilité, modalités d’inscription]</strong></p><p><strong>Avec [organisation partenaire, sous réserve de son accord].</strong></p><p><strong>[Lien d’inscription]</strong></p><h3>Courriel d’invitation par le partenaire</h3><p><strong>Objet :</strong> [Ville] — 45 minutes pour débattre de l’IA dans nos organisations</p><p>Bonjour,</p><p>Quels usages de l’IA voyez-vous émerger dans votre activité ? Quelles opportunités et quelles questions cela soulève-t-il pour vos équipes ?</p><p>Avec la Fresque de l’IA, [organisation] vous invite à une <strong>rencontre gratuite de 45 minutes</strong>, le [date] à [lieu]. Nous échangerons entre acteurs de [territoire] autour de situations concrètes, avec l’appui d’un animateur local. Aucun prérequis n’est nécessaire.</p><p><strong>Inscription : [lien]</strong> — [nombre] places disponibles. Nous serons heureux de vous y retrouver.</p><p>[Signature partenaire]</p><h3>Publication LinkedIn de l’animateur</h3><p>📍 [Ville], [date] : parlons de l’IA telle qu’elle se vit dans nos organisations.</p><p>Pendant 45 minutes, nous réunirons des acteurs de [territoire] pour échanger sur les usages de l’IA, les bénéfices attendus, les risques et les conditions pour avancer. La Fresque de l’IA servira de support à la discussion.</p><p>Cette rencontre gratuite est organisée avec [partenaire, sous réserve d’accord]. Dirigeants, salariés et professionnels du territoire : vos expériences et vos questions sont les bienvenues, sans prérequis.</p><p>👉 Inscription : [lien] [capacité ou date limite si applicable]</p><h3>Message direct au réseau de l’animateur</h3><p>Bonjour [Prénom], nous organisons à [ville] le [date] un échange gratuit de 45 minutes sur les usages et les impacts de l’IA dans les organisations locales. Je l’anime dans le cadre du Tour de France de la Fresque de l’IA. Je pense que le sujet pourrait vous intéresser ; voici le programme et le lien d’inscription : [lien]. N’hésitez pas à le transmettre à une personne de votre réseau concernée.</p><h3>Relances d’inscription</h3><ul><li><strong>J–14 :</strong> rappel du thème avec une question concrète propre au public local et le lien d’inscription.</li><li><strong>J–5 :</strong> publication courte de l’animateur et second relais de l’hôte ; mentionner les places restantes uniquement si le chiffre est exact.</li><li><strong>J–1 :</strong> rappel logistique aux inscrits avec horaire, adresse et accès ; leur demander de venir avec une question IA.</li><li><strong>J+1 ou J+2 :</strong> remerciement, ressources promises, possibilité de prendre contact pour un atelier complet si intérêt exprimé.</li></ul>", "07_Plan_action_et_suivi.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>7. Plan d’action des animateurs</h2><table><thead><tr><th>Période indicative</th><th>Action</th><th>Résultat attendu</th></tr></thead><tbody><tr><td>Jusqu’au 14 octobre 2026</td><td>Recevoir les éléments nationaux, définir un territoire réaliste, lister 15 à 25 relais prioritaires et les contacts chauds</td><td>Liste ciblée et messages personnalisables</td></tr><tr><td>Du 15 octobre à mi-novembre</td><td>Contacter les relais, appeler les plus pertinents, obtenir les premiers rendez-vous</td><td>Quelques partenaires engagés avec prochaine action datée</td></tr><tr><td>Mi-novembre à mi-décembre</td><td>Confirmer les étapes, les rôles, les dates, les lieux et les liens d’inscription</td><td>Événements publiables</td></tr><tr><td>Décembre à janvier</td><td>Déployer invitations, relais partenaires, publications et messages personnels</td><td>Inscriptions suivies chaque semaine</td></tr><tr><td>Janvier et février 2027</td><td>Animer, remercier, documenter les questions et assurer un suivi sollicité</td><td>Débats tenus et demandes de suite qualifiées</td></tr></tbody></table><p><strong>Priorité commerciale :</strong> commencer par les réseaux ayant à la fois une audience pertinente, une capacité de diffusion réelle et une personne identifiable. Un acteur prestigieux sans engagement de communication sera moins utile qu’un réseau local actif.</p><p><strong>Cadence simple par cible :</strong> premier contact personnalisé → relance à 5–7 jours ouvrés → appel si numéro disponible → dernier message à 7–10 jours ouvrés. Arrêter la séquence après un refus ou une demande de ne plus être contacté. Coordonner les démarches entre animateurs pour éviter plusieurs sollicitations de la même structure.</p><p><strong>Tableau de pilotage partagé, une ligne par organisation :</strong> territoire ; organisation ; type ; contact ; lien avec l’animateur ; date et canal du dernier contact ; réponse ; prochaine action et responsable ; potentiel de mobilisation ; lieu possible ; étape confirmée ; lien d’inscription ; inscrits ; présents ; suites demandées. Revoir les chiffres chaque semaine : contacts utiles, rendez-vous obtenus, partenaires confirmés, étapes publiées, inscrits et présents.</p>", "08_Conseils_terrain.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>8. Conseils terrain</h2><ul><li><strong>Ancrer chaque invitation dans un problème vécu.</strong> Adapter l’angle à la branche ou au territoire : temps gagné, compétences, confidentialité, qualité, impacts environnementaux ou accès à l’IA.</li><li><strong>Activer les introductions chaudes.</strong> Demander aux anciens clients, animateurs et partenaires de présenter la bonne personne plutôt que d’envoyer uniquement des messages génériques.</li><li><strong>Proposer deux options faciles à choisir.</strong> Deux créneaux d’échange ou deux formats d’accueil valent mieux qu’une question vague.</li><li><strong>S’appuyer sur les canaux du partenaire.</strong> Lettre aux adhérents, agenda, page d’événement, groupes locaux, réseaux sociaux et prise de parole lors d’un rendez-vous existant.</li><li><strong>Rendre l’étape visible localement.</strong> Une annonce commune, une photo autorisée et une restitution courte des questions posées prolongent la conversation après l’événement.</li><li><strong>Assumer clairement la suite commerciale.</strong> Présenter brièvement l’atelier complet et laisser les intéressés demander une proposition ; ne pas transformer les 45 minutes en démonstration de vente.</li><li><strong>Partager les apprentissages entre animateurs.</strong> Noter les objections, les formulations qui fonctionnent et les relais efficaces pour améliorer le kit pendant la tournée.</li></ul>", "09_Mode_emploi_et_elements_nationaux.html": "<p><a href=\"#\" onclick=\"showDoc('00_Sommaire.html'); return false;\" >← Sommaire</a></p><h2>9. Mode d’emploi du kit et éléments à produire au niveau national</h2><p>Ce document constitue la <strong>V1 éditoriale et commerciale</strong>. Pour la distribuer aux animateurs le 15 octobre, joindre :</p><ol><li>Une fiche de présentation de l’événement et une fiche partenaire d’une page.</li><li>Un visuel modifiable par ville, date et partenaire ; modèles carré et bannière.</li><li>Une page d’inscription type et une carte ou liste des étapes confirmées.</li><li>Un bref conducteur d’animation des 45 minutes, avec une conclusion commune.</li><li>Un tableau de suivi partagé et un référent national pour arbitrer les doublons ou questions.</li><li>Une FAQ de modalités : gratuité, frais, inscription, logos, données, photos, suivi commercial et annulation.</li></ol><p><strong>Conducteur indicatif des 45 minutes :</strong> accueil et question d’ouverture (5 min) ; échanges sur des usages concrets (15 min) ; impacts, risques et conditions de réussite (15 min) ; synthèse et présentation courte de la Fresque de l’IA (7 min) ; conclusion et suites éventuelles (3 min). Ajuster ce rythme au nombre de participants et au format retenu.</p>"};

  const idx=NAV.indexOf(fname);

}
